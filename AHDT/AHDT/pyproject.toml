[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ahdt-reference"
version = "0.1.0"
description = "Reference implementation of an Adaptive Hybrid-feature Decision Tree"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[tool.setuptools]
py-modules = ["model", "data", "evaluation"]
